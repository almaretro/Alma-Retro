<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--color-bg-cream) 0%, var(--color-gray-light) 100%);
        }
        
        .login-box {
            background: var(--color-white);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        
        .login-title {
            font-family: var(--font-serif);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--color-text-black);
        }
        
        .login-subtitle {
            text-align: center;
            color: var(--color-gray-medium);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text-black);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-gray-light);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: border-color var(--transition-normal);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent-red);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--color-accent-red);
            color: var(--color-white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .btn-login:hover {
            background-color: #6B2A2A;
            transform: translateY(-2px);
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-gray-medium);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        .back-link:hover {
            color: var(--color-accent-red);
        }
        
        .flash-message {
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .flash-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">Admin</h1>
            <p class="login-subtitle">Alma Retrô - Painel Administrativo</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required autofocus>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            
            <a href="/" class="back-link">← Voltar ao site</a>
        </div>
    </div>
</body>
</html>
